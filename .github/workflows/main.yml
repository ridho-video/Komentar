name: Build EXE (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Live-Overlay-Lite-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Move latest tag to this commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TikTok Live Overlay Lite (Terbaru)
          body: Versi terbaru, diperbarui otomatis setiap ada perubahan di branch main.
          files: dist/*.exe
          overwrite_files: true
          make_latest: true
